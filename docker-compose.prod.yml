# docker-compose de PRODUÇÃO do Orchestrator (VPS), diferente do
# docker-compose.yml da raiz (que só sobe Redis para desenvolvimento local).
#
# O que NÃO está aqui, de propósito:
# - Postgres: é Supabase gerenciado (ver ADR 0001 em docs/architecture/decisions),
#   não roda neste compose nem nesta VPS.
# - Node Agents (desigual-node, studio-node, otto-node): rodam nas máquinas
#   físicas dos agentes (Mac Minis + PC da RTX), fora do VPS. Ver o README de
#   cada um em nodes/*/README.md.
#
# Uso:
#   RELEASE_SHA=$(git rev-parse HEAD) \
#     docker compose -f docker-compose.prod.yml --env-file .env up -d --build
#
# O RELEASE_SHA na frente não é enfeite: .git está no .dockerignore, então
# dentro da imagem não há repositório pra consultar e /health responderia
# "unknown" em release_sha — ou seja, ninguém conseguiria dizer QUAL commit
# está no ar. Esquecer o prefixo não quebra o build, só volta ao "unknown".
#
# Pré-requisito: um .env de produção na raiz do repo, preenchido a partir de
# .env.example (ver docs/runbook.md para a sequência completa de deploy).

services:
  redis:
    image: redis:7-alpine
    container_name: desigual-os-redis
    restart: unless-stopped
    # Diferente do compose de dev: aqui SEMPRE com senha (REDIS_PASSWORD no
    # .env). Sem isso, qualquer processo que alcance a porta do Redis dentro
    # da VPS conseguiria ler/escrever a fila de jobs e o pub/sub do WebSocket.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD precisa estar definida no .env de produção}"]
    # A senha também precisa existir DENTRO do container, não só na linha de
    # comando: o healthcheck abaixo roda `redis-cli -a "$$REDIS_PASSWORD"`, e
    # `$$` é escape do compose justamente pra variável ser lida em runtime, lá
    # dentro. Sem este bloco ela chegava vazia, o AUTH falhava com WRONGPASS e
    # o Redis ficava eternamente `unhealthy` — o que derrubava api e worker
    # junto, via `depends_on: condition: service_healthy`, com o Redis na
    # verdade funcionando perfeitamente (07/10/2026, primeiro deploy na VPS).
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD precisa estar definida no .env de produção}
    volumes:
      - redis_data:/data
    # Sem "ports:" de propósito: o Redis não precisa ser alcançável de fora
    # do compose (regra de ouro 3, nada exposto publicamente sem necessidade).
    # api e worker chegam nele pela rede interna do compose, pelo nome do
    # serviço ("redis"). Para inspecionar manualmente, use
    # `docker compose -f docker-compose.prod.yml exec redis redis-cli -a ...`.
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile.prod
      target: api
      args:
        RELEASE_SHA: "${RELEASE_SHA:-}"
    container_name: desigual-os-api
    restart: unless-stopped
    # Todo o resto das variáveis (SUPABASE_*, ANTHROPIC_API_KEY, NODE_SECRET,
    # etc.) vem do .env de produção, nunca hardcoded aqui. Ver .env.example
    # na raiz para a lista completa e o que cada uma faz.
    env_file:
      - .env
    environment:
      NODE_ENV: production
    volumes:
      - whatsapp_media:/data/whatsapp-media
    depends_on:
      redis:
        condition: service_healthy
    # Bind só em 127.0.0.1: a API não fica exposta direto na internet, quem
    # fala com o mundo externo é o Nginx na frente, com TLS (regra de ouro 3;
    # ver docs/deploy/vps-nginx.conf.example). Ajuste a porta do host se
    # PORT no .env for diferente de 3001.
    ports:
      - "127.0.0.1:${PORT:-3001}:3001"
    healthcheck:
      # GET /health é público (sem auth), existe exatamente para isto.
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    build:
      context: .
      dockerfile: Dockerfile.prod
      target: worker
      args:
        RELEASE_SHA: "${RELEASE_SHA:-}"
    container_name: desigual-os-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
    volumes:
      - whatsapp_media:/data/whatsapp-media
    depends_on:
      redis:
        condition: service_healthy
    # Sem "ports:": o worker não expõe HTTP, só consome as filas do Redis.
    healthcheck:
      # O worker não tem endpoint HTTP (é consumidor BullMQ puro), então não
      # dá para checar "processando de verdade" sem inventar um sinal. Isto
      # aqui confere só se o processo Node do worker ainda está de pé, uma
      # checagem fraca mas honesta. O sinal forte de saúde real (fila
      # acumulando ou não) é lido de fora, no Redis: ver docs/runbook.md.
      test: ["CMD-SHELL", "pgrep -f 'dist/index.js' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  openwa:
    image: ghcr.io/rmyndharis/openwa:0.25.0
    container_name: desigual-os-openwa
    restart: unless-stopped
    stop_grace_period: 75s
    # Cada número conectado é um Chrome inteiro (~0,7–1 GB com o WhatsApp Web
    # carregado). Com 2 GB e dois números, o kernel matou o Chrome no meio do
    # primeiro sync real (19/10/2026, "Memory cgroup out of memory"), derrubando
    # a sessão e o envio. 4 GB cabe ~3–4 números nesta VPS de 8 GB; acima disso,
    # mais RAM na VPS ou o engine Baileys (sem navegador).
    mem_limit: ${OPENWA_MEM_LIMIT:-4g}
    pids_limit: ${OPENWA_PIDS_LIMIT:-2048}
    security_opt:
      - 'no-new-privileges:true'
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - KILL
      - SETGID
      - SETUID
    read_only: true
    tmpfs:
      - /tmp
    ports:
      - "127.0.0.1:2785:2785"
    environment:
      NODE_ENV: production
      NODE_ID: desigual-os-vps-openwa
      API_MASTER_KEY: ${OPENWA_ADMIN_API_KEY:?OPENWA_ADMIN_API_KEY precisa estar definida}
      API_KEY_PEPPER: ${OPENWA_API_KEY_PEPPER:?OPENWA_API_KEY_PEPPER precisa estar definida}
      AUTO_START_SESSIONS: "true"
      ENGINE_TYPE: whatsapp-web.js
      WWEBJS_ONBOARDING_CONTINUE_LABELS: Continuar,Continue
      STATUS_SEED_ON_READY: "false"
      SERVE_DASHBOARD: "false"
      UPDATE_CHECK_ENABLED: "false"
      DATABASE_SYNCHRONIZE: "false"
      # 100 MB, igual ao WHATSAPP_MEDIA_MAX_BYTES da API (base64 de 100 MB ≈ 134 MB, daí o BODY_SIZE_LIMIT).
      MEDIA_DOWNLOAD_MAX_BYTES: "104857600"
      MEDIA_CONVERSION_ENABLED: "true"
      CHAT_MEDIA_ARCHIVE_ENABLED: "true"
      MESSAGE_INLINE_MEDIA: archive
      CHAT_MEDIA_ARCHIVE_MAX_BYTES: "104857600"
      BODY_SIZE_LIMIT: 150mb
      INFLIGHT_BODY_BUDGET_BYTES: "419430400"
      WEBHOOK_MEDIA_INLINE_MAX_BYTES: "0"
      WEBHOOK_FAILURE_PAYLOAD_RETENTION_HOURS: "24"
      SSRF_ALLOWED_HOSTS: api,localhost,127.0.0.1
      # Limitador do OpenWA conta por IP de origem, e todo o tráfego vem do
      # container da API/worker: os padrões (100/min, 1000/h) somam TODAS as
      # pessoas conectadas. Um sync de 1000 conversas estourava sozinho
      # (19/10/2026: 218 conversas sem mensagem por "Too Many Requests") e
      # depois barraria até o envio pela Inbox. A porta só existe na rede
      # interna (127.0.0.1 e compose), então o limite alto não expõe nada.
      RATE_LIMIT_SHORT_LIMIT: ${OPENWA_RATE_LIMIT_SHORT:-200}
      RATE_LIMIT_MEDIUM_LIMIT: ${OPENWA_RATE_LIMIT_MEDIUM:-6000}
      RATE_LIMIT_LONG_LIMIT: ${OPENWA_RATE_LIMIT_LONG:-200000}
    volumes:
      - openwa_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2785/api/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s

volumes:
  redis_data:
  whatsapp_media:
  openwa_data:
