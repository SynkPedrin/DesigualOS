# Vhost do Orchestrator (apps/api) em api.desigual.com.br.
#
# Diferente de docs/deploy/vps-nginx.conf.example (que é o modelo genérico,
# para um VPS vazio): este arquivo é o vhost REAL desta VPS, e ela NÃO está
# vazia — roda nginx 1.22.1 com um site de terceiro no ar
# (desigual.manadachat.com.br, cert Let's Encrypt válido). Por isso aqui:
#
#   1. O certificado é emitido com `certbot certonly --webroot`, NÃO com
#      `certbot --nginx`. O plugin --nginx reescreve server blocks; certonly
#      não encosta em nenhuma configuração. Numa VPS compartilhada isso é a
#      diferença entre adicionar um site e arriscar derrubar o do vizinho.
#   2. Este arquivo é um vhost NOVO em sites-available. Nada do que já existe
#      é editado, movido ou recarregado de forma destrutiva.
#
# Instalação (Debian 12, nginx já instalado):
#
#   # 0) pré-requisito: A record api.desigual.com.br -> 191.252.203.180
#   dig +short api.desigual.com.br    # precisa devolver o IP da VPS
#
#   # 1) webroot do desafio ACME (compartilhável entre vhosts, não exclusivo)
#   sudo mkdir -p /var/www/certbot
#
#   # 2) sobe SÓ o bloco 80, pra o desafio HTTP-01 conseguir ser servido
#   sudo cp api.desigual.com.br.conf /etc/nginx/sites-available/desigual-os-api
#   sudo ln -s /etc/nginx/sites-available/desigual-os-api /etc/nginx/sites-enabled/
#   # comente o bloco 443 abaixo antes deste teste (o cert ainda não existe,
#   # e o nginx se recusa a carregar apontando pra arquivo inexistente)
#   sudo nginx -t && sudo systemctl reload nginx
#
#   # 3) emite o certificado sem tocar em config nenhuma
#   sudo certbot certonly --webroot -w /var/www/certbot \
#        -d api.desigual.com.br \
#        --non-interactive --agree-tos -m super@institutoalmada.org
#
#   # 4) descomente o bloco 443 e recarregue
#   sudo nginx -t && sudo systemctl reload nginx
#
#   # 5) prova
#   curl -sS https://api.desigual.com.br/health

# --- Bloco 80 ---
# Só serve o desafio ACME e redireciona o resto pra HTTPS. Nenhum proxy pra
# API aqui: sem TLS, nada passa.
server {
    listen 80;
    listen [::]:80;
    server_name api.desigual.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- Bloco 443 ---
# Escrito à mão (certonly não gera isto). Comente o bloco inteiro na primeira
# subida, antes de o certificado existir.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.desigual.com.br;

    ssl_certificate     /etc/letsencrypt/live/api.desigual.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.desigual.com.br/privkey.pem;
    # Gerado pelo certbot no primeiro uso em qualquer modo. Se não existir
    # nesta máquina, comente a linha — o nginx usa os padrões dele, que são
    # aceitáveis, em vez de falhar o reload por include ausente.
    include /etc/letsencrypt/options-ssl-nginx.conf;

    # A API já limita anexo a 25MB no @fastify/multipart
    # (apps/api/src/server.ts). O nginx precisa de um teto igual ou maior,
    # senão corta a requisição antes de ela chegar lá.
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /ws é WebSocket (@fastify/websocket, apps/api/src/ws/routes.ts): sem os
    # headers de Upgrade a conexão cai pra HTTP comum e falha. Timeout longo
    # porque a conexão fica aberta, não é request/response curto.
    location /ws {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
